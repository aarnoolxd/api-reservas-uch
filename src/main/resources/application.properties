spring.application.name=api-reservas-uch
spring.config.import=optional:file:./application-local.properties
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=api-reservas-uch
app.jwt.audience=reservas-react
app.jwt.ttl-seconds=900
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.laravel.guard=web
app.laravel.model-type=App\\Models\\User
server.error.include-message=never
server.error.include-stacktrace=never
